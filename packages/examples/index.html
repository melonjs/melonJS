<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://github.com/melonjs/melonJS/raw/master/media/Favicon/Favicon%20Transparent.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>melonJS examples</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      `#stage` exists so the engine has something correct to MEASURE.

      Automatic scaling measures the parent of the element the canvas is
      mounted in (`resize.ts`, `getParentElement(game.getParentElement())`).
      With `#screen` sitting directly under `<body>`, that was `<body>`, and
      since `#screen` is `position: fixed` it contributes no height, so body
      measured 43px: just the topbar. The engine's body case then falls back
      to the WINDOW, sizing the canvas to the full window height while it
      lives in a box that is 41px shorter, so the bottom was cropped by the
      height of the topbar on every resize.
    -->
    <div id="stage"><div id="screen"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
