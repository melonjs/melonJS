name: Build & Test
# Runs lint + test on every push/PR — no path-filtered shim partition.
# The previous two-workflow setup (`main.yml` + `main-docs.yml`) was
# racy on mixed PRs (PRs touching both `.md` and code): GitHub Actions
# evaluates `paths` / `paths-ignore` against the full PR diff, so a
# mixed PR triggered BOTH workflows, they shared `concurrency.group`,
# and the faster docs-shim cancelled the real CI run while still
# reporting green checks. Docs-only PRs pay ~2 minutes of CI cost as
# the trade-off; cheaper than silently merging a lint failure.
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      # Turborepo's cache: what each package's build, lint and type check gave,
      # by a fingerprint of its files and of what it depends on. Restored from
      # the latest run, a task whose fingerprint is unchanged is skipped, so a
      # change that leaves a package alone does not build or lint it again, and
      # the test job reuses what the lint job built. An entry that no longer
      # matches is simply not used: a stale cache cannot give a wrong result.
      # The lockfile is in the key so the cache starts afresh when dependencies
      # change, which is when most of it stops matching anyway.
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm i
      # ESLint for each package, Biome and the type checks, after a build
      - run: pnpm lint
      - run: pnpm build

  test:
    needs: lint
    runs-on: ubuntu-latest
    # TEMPORARY, for this pull request only: the job runs twelve times, six as
    # it is meant to and six with the test server making the browser
    # re-validate every module, as it did before. Each prints what its pages
    # held, and what a page that was lost was doing when it went.
    strategy:
      fail-fast: false
      matrix:
        modules: [kept, revalidated]
        copy: [1, 2, 3, 4, 5, 6]
    continue-on-error: ${{ matrix.modules == 'revalidated' }}
    container:
      # must match the workspace's playwright version (root devDependencies)
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      # The cache steps below compress with zstd where it is installed and with
      # gzip where it is not, and a cache saved one way is not found the other.
      # This image has no zstd: with it, the job reads the caches the lint job
      # saved, and so the build it has just made.
      - name: Install zstd, to share caches with the lint job
        run: apt-get update -qq && apt-get install -y -qq zstd
      - uses: pnpm/action-setup@v5
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      # Turborepo's cache (see the lint job)
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm i
      # TEMPORARY: see the comment on the job
      - run: node .github/instrument-test-runner.mjs
      # Vitest 4.1.11 runs each worker as one long-lived orchestrator page and
      # dispatches every spec file over a single websocket. Its ws close handler
      # destroys the session and rejects the pending `createTesters`, so if that
      # socket drops the whole run dies — the in-page client does try to
      # reconnect, but the session is already gone. Underneath, the browser
      # intermittently severs a renderer's network-service channels: every
      # websocket for that page dies at once, the server sees a graceful 1001
      # while the page sees 1006, and no process crashes.
      #
      # Measured at 4 deaths in 21 local runs, and it cost three attempts to
      # land a PR that changed nothing but Markdown. Not our code: no test ever
      # fails, and the spec it names is just whichever was in flight. Launching
      # the full Chromium build fixes it locally (20 runs clean) but does
      # nothing here (0 of 4), so this retries instead.
      #
      # The condition is deliberately narrow — the page must have been lost AND
      # no test may have failed. A real failure prints "N failed" in the summary
      # and exits without a retry.
      - name: Test (retries once if vitest loses its browser page)
        # the container has no default bash, so GitHub would run this under
        # dash, which has no `pipefail` — and without it the exit status of
        # `pnpm test` is masked by `tee`
        shell: bash
        env:
          MELONJS_TESTS_REVALIDATE: ${{ matrix.modules == 'revalidated' && '1' || '' }}
          WSLOG: ${{ github.workspace }}/page-events.log
        run: |
          set -o pipefail
          # TEMPORARY: see the comment on the job
          echo "handle limit of this shell (soft/hard): $(ulimit -Sn)/$(ulimit -Hn)"
          df -h /tmp
          node .github/page-resources.mjs > page-resources.log 2>&1 &
          sampler=$!
          trap 'kill -TERM "$sampler" 2>/dev/null; sleep 2; echo "--- attempts made: $attempt ---"; echo "--- page events ---"; grep -v ": starts " "$WSLOG"; echo "--- last spec files started ---"; grep ": starts " "$WSLOG" | tail -6; echo "--- page resources ---"; cat page-resources.log' EXIT
          for attempt in 1 2; do
            if pnpm test 2>&1 | tee "test-$attempt.log"; then
              exit 0
            fi
            if ! grep -q "Browser connection was closed" "test-$attempt.log" \
              || grep -qE "Test Files.*[0-9]+ failed" "test-$attempt.log"; then
              echo "::error::test failed for a real reason, not the known browser flake"
              exit 1
            fi
            echo "::warning::vitest lost its browser page (upstream flake) — attempt $attempt"
          done
          echo "::error::vitest lost its browser page on both attempts"
          exit 1
      - run: pnpm -F @melonjs/matter-adapter test
      - run: pnpm -F @melonjs/planck-adapter test
      - run: pnpm -F @melonjs/rapier2d-adapter test
      - run: pnpm -F @melonjs/rapier3d-adapter test
      - run: pnpm -F @melonjs/debug-plugin test
      - run: pnpm -F @melonjs/gamepad-plugin test
      - run: pnpm -F @melonjs/pathfinding-plugin test
      - run: pnpm -F @melonjs/tiled-inflate-plugin test

  # Windows build — only on master push, not on PRs
  windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      # Turborepo's cache (see the lint job)
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm i
      - run: pnpm lint
      - run: pnpm build
